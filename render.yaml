services:
  - type: web
    name: skyping-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: UPPTIME_STATUS_URL
        value: "https://skytech-alt.github.io/SkyPing/api/status.json"
