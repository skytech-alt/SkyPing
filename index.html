<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyPing — статус российских сервисов</title>
  <!-- Добавили пустую иконку, чтобы убрать красную ошибку в консоли -->
  <link rel="icon" href="data:,">
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .container { max-width: 600px; width: 100%; text-align: center; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; }
    .subtitle { color: #666; margin-bottom: 32px; font-size: 0.95rem; }
    
    /* Обновили классы, чтобы они совпадали со скриптом */
    .service-card { background: #fff; border-radius: 12px; padding: 16px 20px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .service-name { font-weight: 600; font-size: 1.05rem; }
    .status-badge { font-size: 0.95rem; font-weight: 500; }
    .status-up { color: #0a7d32; }
    .status-down { color: #c62828; }
    .status-unknown { color: #888; }
    
    .cta { display: inline-block; margin-top: 24px; background: #2563eb; color: #fff; padding: 14px 32px; border-radius: 10px; text-decoration: none; font-weight: 600; transition: background 0.2s; }
    .cta:hover { background: #1d4ed8; }
    .updated { margin-top: 16px; font-size: 0.8rem; color: #999; }
    .error { color: #c62828; }
  </style>
</head>
<body>
  <div class="container">
    <h1>SkyPing</h1>
    <p class="subtitle">Доступность Госуслуг, VK, Ozon и банков</p>
    
    <div id="services">
      <p>Загрузка…</p>
    </div>
    
    <!-- ВОТ ОН, тот самый пропущенный элемент для текста обновления -->
    <p class="updated" id="updated"></p>

    <a class="cta" href="https://t.me/SkyPing_robot" target="_blank" rel="noopener">
      Узнать, когда заработает
    </a>
  </div>

  <script>
    const STATUS_URL = "https://raw.githubusercontent.com/skytech-alt/SkyPing/main/history/summary.json";

    async function loadStatus() {
      const container = document.getElementById("services");
      const updatedEl = document.getElementById("updated");

      try {
        const resp = await fetch(STATUS_URL, { cache: "no-store" });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const data = await resp.json();

        const services = Array.isArray(data) ? data : (data.services || []);
        if (!services.length) {
          container.innerHTML = '<p class="error">Данных пока нет.</p>';
          return;
        }

        container.innerHTML = services.map(svc => {
          const name = svc.name || "Сервис";
          const status = (svc.status || "unknown").toLowerCase();
          let label, cls;
          
          if (status === "up")       { label = "🟢 Работает";  cls = "status-up"; }
          else if (status === "down"){ label = "🔴 Недоступен"; cls = "status-down"; }
          else                       { label = "⚪ Неизвестно"; cls = "status-unknown"; }

          return `
            <div class="service-card">
              <span class="service-name">${escapeHtml(name)}</span>
              <span class="status-badge ${cls}">${label}</span>
            </div>`;
        }).join("");

        updatedEl.textContent = "Обновлено: " + new Date().toLocaleString("ru-RU");
      } catch (e) {
        console.error("Ошибка загрузки:", e);
        container.innerHTML = '<p class="error">Не удалось загрузить статус.</p>';
      }
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    loadStatus();
    setInterval(loadStatus, 60_000);
  </script>
</body>
</html>
