<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyPing — статус российских сервисов</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #f5f5f5; --card-bg: #ffffff; --text: #1a1a1a; --text-muted: #666;
      --up: #0a7d32; --down: #c62828; --unknown: #888; --primary: #2563eb; --primary-hover: #1d4ed8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212; --card-bg: #1e1e1e; --text: #f5f5f5; --text-muted: #aaa;
        --up: #4ade80; --down: #f87171; --unknown: #888; --primary: #3b82f6; --primary-hover: #2563eb;
      }
    }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; transition: background 0.3s; }
    .container { max-width: 640px; width: 100%; text-align: center; }
    h1 { font-size: 2rem; margin-bottom: 8px; }
    .subtitle { color: var(--text-muted); margin-bottom: 32px; font-size: 1rem; }
    
    /* Карточки */
    .service-card { background: var(--card-bg); border-radius: 12px; padding: 16px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.1); transition: transform 0.2s; }
    .service-card:hover { transform: translateY(-2px); }
    .service-info { text-align: left; flex-grow: 1; }
    .service-name { font-weight: 600; font-size: 1.1rem; display: block; text-decoration: none; color: var(--text); }
    .service-name:hover { text-decoration: underline; }
    .service-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; display: block; }
    
    /* Статусы */
    .status-badge { font-size: 0.9rem; font-weight: 600; white-space: nowrap; }
    .status-up { color: var(--up); }
    .status-down { color: var(--down); }
    .status-unknown { color: var(--unknown); }
    
    /* Кнопки */
    .btn-sub { margin-left: 12px; background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 0.85rem; transition: all 0.2s; text-decoration: none; }
    .btn-sub:hover { background: var(--primary); color: #fff; }
    .cta { display: inline-block; margin-top: 32px; background: var(--primary); color: #fff; padding: 16px 32px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 1.1rem; transition: background 0.2s; box-shadow: 0 4px 12px rgba(37,99,235,.3); }
    .cta:hover { background: var(--primary-hover); }
    .updated { margin-top: 20px; font-size: 0.8rem; color: var(--text-muted); }
    .error { color: var(--down); }
  </style>
</head>
<body>
  <div class="container">
    <h1>SkyPing</h1>
    <p class="subtitle">Мониторинг доступности российских сервисов</p>
    
    <div id="services">
      <!-- Скелетоны для загрузки -->
      <div class="service-card" style="opacity: 0.5;">Загрузка данных...</div>
    </div>
    
    <p class="updated" id="updated"></p>

    <a class="cta" href="https://t.me/SkyPing_robot" target="_blank" rel="noopener">
      🚀 Подписаться на все уведомления
    </a>
  </div>

  <script>
    // Ссылка на raw-файл Upptime
    const STATUS_URL = "https://raw.githubusercontent.com/skytech-alt/SkyPing/main/history/summary.json";
    // Имя твоего бота (для Deep Links)
    const BOT_NAME = "SkyPing_robot"; 

    async function loadStatus() {
      const container = document.getElementById("services");
      const updatedEl = document.getElementById("updated");

      try {
        const resp = await fetch(STATUS_URL, { cache: "no-store" });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const data = await resp.json();

        const services = Array.isArray(data) ? data : (data.services || []);
        if (!services.length) {
          container.innerHTML = '<p class="error">Данных пока нет.</p>';
          return;
        }

        container.innerHTML = services.map(svc => {
          const name = svc.name || "Сервис";
          const url = svc.url || "#";
          const status = (svc.status || "unknown").toLowerCase();
          
          // Вычисляем аптайм за 24 часа (если есть данные)
          const uptime = svc.uptime ? svc.uptime.toFixed(1) + "%" : "н/д";
          
          let label, cls;
          if (status === "up")       { label = "🟢 Работает";  cls = "status-up"; }
          else if (status === "down"){ label = "🔴 Недоступен"; cls = "status-down"; }
          else                       { label = "⚪ Неизвестно"; cls = "status-unknown"; }

          // Формируем Deep Link для подписки на КОНКРЕТНЫЙ сервис
          const deepLink = `https://t.me/${BOT_NAME}?start=sub_${encodeURIComponent(name)}`;

          return `
            <div class="service-card">
              <div class="service-info">
                <a href="${url}" target="_blank" class="service-name">${escapeHtml(name)}</a>
                <span class="service-meta">Аптайм 24ч: ${uptime}</span>
              </div>
              <div style="display: flex; align-items: center;">
                <span class="status-badge ${cls}">${label}</span>
                <a href="${deepLink}" class="btn-sub" target="_blank">Уведомлять</a>
              </div>
            </div>`;
        }).join("");

        updatedEl.textContent = "Обновлено: " + new Date().toLocaleString("ru-RU");
      } catch (e) {
        console.error("Ошибка загрузки:", e);
        container.innerHTML = '<p class="error">Не удалось загрузить статус.</p>';
      }
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    loadStatus();
    setInterval(loadStatus, 60_000);
  </script>
</body>
</html>
